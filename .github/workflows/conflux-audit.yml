name: conflux-audit

on:
  push:
    paths:
      - "tools/conflux-audit/**"
      - ".github/workflows/conflux-audit.yml"
  pull_request:
    paths:
      - "tools/conflux-audit/**"
      - ".github/workflows/conflux-audit.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: tools/conflux-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m conflux_audit . --format json
